<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE PORTFOLIO — ASCII Intro</title>
<style>
  :root {
    --bg:#dcdcda;
    --ink:#2b2ab8;
  }
  * { box-sizing:border-box; }
  html, body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
  }
  body {
    font-family:Arial, Helvetica, sans-serif;
    cursor:none;
  }
  .stage {
    position:fixed;
    inset:0;
    background:var(--bg);
    overflow:hidden;
  }
  .ascii-wrap {
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    overflow:hidden;
    opacity:1;
    transform:scale(1.30);
    transition:
      opacity 900ms cubic-bezier(.25,.1,.25,1),
      transform 1100ms cubic-bezier(.25,.1,.25,1),
      filter 1000ms cubic-bezier(.25,.1,.25,1);
  }
  .ascii {
    margin:0;
    white-space:pre;
    font-family:"SF Mono", ui-monospace, Menlo, "SF Mono", ui-monospace, Menlo, "Courier New", monospace;
    font-weight:700;
    font-size:clamp(8px, 1.03vw, 15px);
    line-height:.88;
    letter-spacing:-.075em;
    color:var(--ink);
    text-align:left;
    user-select:none;
    transform:translate3d(0,0,0);
    will-change:contents, transform;
  }
  .stage.exit .ascii-wrap {
    opacity:0;
    transform:scale(1.38);
    filter:blur(6px);
  }


  #fireworksCanvas {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
    opacity:0;
    transition:opacity 260ms ease;
    z-index:4;
  }

  .stage.fireworks #fireworksCanvas {
    opacity:1;
  }

  .name-scene {
    position:absolute;
    z-index:5;
    inset:0;
    display:grid;
    place-items:center;
    opacity:0;
    transform:translateY(8px) scale(.992);
    filter:blur(2px);
    transition:
      opacity 1100ms cubic-bezier(.32,.72,0,1),
      transform 1400ms cubic-bezier(.32,.72,0,1),
      filter 1300ms cubic-bezier(.32,.72,0,1);
    pointer-events:none;
  }

  .stage.show-name .name-scene {
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }

  #nameCanvas {
    width:min(84vw, 1320px);
    height:min(52vh, 520px);
    display:block;
  }

  @media (max-width:700px) {
    .ascii {
      font-size:6.2px;
      line-height:.88;
      letter-spacing:-.085em;
    }
    #nameCanvas {
      width:92vw;
      height:40vh;
    }
  }

  @media (prefers-reduced-motion:reduce) {
    .ascii-wrap,.name-scene { transition:none !important; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="ascii-wrap">
    <pre class="ascii" id="ascii" aria-hidden="true"></pre>
  </div>

  <canvas id="fireworksCanvas" aria-hidden="true"></canvas>

  <div class="name-scene" aria-hidden="true">
    <canvas id="nameCanvas"></canvas>
  </div>
</main>

const stage = document.getElementById('stage');
const ascii = document.getElementById('ascii');
const nameCanvas = document.getElementById('nameCanvas');
const nctx = nameCanvas.getContext('2d');

const fireworksCanvas = document.getElementById('fireworksCanvas');
const fctx = fireworksCanvas.getContext('2d');

let fwDpr = 1;
let fireworks = [];
let sparks = [];
let fireworksActive = false;
let fireworksStartedAt = 0;

const FW_CHARS = '·:+*<>!?I235468A0ON';

function resizeFireworks() {
  fwDpr = Math.min(window.devicePixelRatio || 1, 2);
  fireworksCanvas.width = Math.round(window.innerWidth * fwDpr);
  fireworksCanvas.height = Math.round(window.innerHeight * fwDpr);
  fireworksCanvas.style.width = window.innerWidth + 'px';
  fireworksCanvas.style.height = window.innerHeight + 'px';
  fctx.setTransform(fwDpr,0,0,fwDpr,0,0);
}
resizeFireworks();
window.addEventListener('resize', resizeFireworks);

function spawnBurst(cx, cy, count, radiusScale=1) {
  for (let i=0;i<count;i++) {
    const a = (Math.PI*2*i/count) + (Math.random()-.5)*.11;
    const speed = (1.4 + Math.random()*3.1) * radiusScale;
    sparks.push({
      x:cx,
      y:cy,
      vx:Math.cos(a)*speed,
      vy:Math.sin(a)*speed,
      life:1,
      decay:.010 + Math.random()*.012,
      char:FW_CHARS[Math.floor(Math.random()*FW_CHARS.length)],
      size:5 + Math.random()*4,
      spin:Math.random()*6.28,
      seed:Math.random()*1000
    });
  }
}

function startFireworks() {
  sparks = [];
  fireworksActive = true;
  fireworksStartedAt = performance.now();
  stage.classList.add('fireworks');

  const W = window.innerWidth;
  const H = window.innerHeight;

  // One single ASCII firework burst in the center.
  // Slightly above center so it bridges naturally into the name reveal.
  spawnBurst(W*.50, H*.46, 150, 1.22);

  setTimeout(() => {
    fireworksActive = false;
    stage.classList.remove('fireworks');
  }, 1450);
}

function drawFireworks(now) {
  fctx.clearRect(0,0,window.innerWidth,window.innerHeight);

  if (sparks.length) {
    fctx.textAlign='center';
    fctx.textBaseline='middle';

    for (const s of sparks) {
      s.x += s.vx;
      s.y += s.vy;
      s.vx *= .986;
      s.vy = s.vy*.986 + .006;
      s.life -= s.decay;

      if (s.life <= 0) continue;

      const flicker=.72 + Math.sin(now*.018+s.seed)*.18;
      fctx.font=`600 ${s.size}px "SF Mono", ui-monospace, Menlo, "Courier New", monospace`;
      fctx.fillStyle=`rgba(43,42,184,${Math.max(0,s.life)*flicker})`;
      fctx.fillText(s.char,s.x,s.y);
    }

    sparks = sparks.filter(s => s.life > 0);
  }

  requestAnimationFrame(drawFireworks);
}
requestAnimationFrame(drawFireworks);

const NAME_RAMP = ' ·.:;,-~+=/<>!?I132546798A0ODBNM';
const AMBIENT_RAMP = ' ·.:/<>?!I235468A0ON';

let nameParticles = [];
let ambientParticles = [];
let nameDpr = 1;

function sampleMask(data, mw, mh, x, y) {
  // 4-point supersampling for smoother contours.
  const pts = [
    [x-.22,y-.22],[x+.22,y-.22],
    [x-.22,y+.22],[x+.22,y+.22]
  ];
  let total = 0;

  for (const [sx,sy] of pts) {
    const px = Math.max(0, Math.min(mw-1, Math.floor(sx)));
    const py = Math.max(0, Math.min(mh-1, Math.floor(sy)));
    const idx = (py*mw+px)*4;
    total += 1-data[idx]/255;
  }
  return total/pts.length;
}

function buildNameScene() {
  const rect = nameCanvas.getBoundingClientRect();
  nameDpr = Math.min(window.devicePixelRatio || 1, 2);
  nameCanvas.width = Math.max(1, Math.round(rect.width * nameDpr));
  nameCanvas.height = Math.max(1, Math.round(rect.height * nameDpr));
  nctx.setTransform(nameDpr,0,0,nameDpr,0,0);

  const w = rect.width;
  const h = rect.height;

  const mask = document.createElement('canvas');
  const scale = .72; // higher mask resolution for finer edges
  mask.width = Math.max(1, Math.round(w * scale));
  mask.height = Math.max(1, Math.round(h * scale));
  const mctx = mask.getContext('2d');

  mctx.fillStyle = '#fff';
  mctx.fillRect(0,0,mask.width,mask.height);

  // Apple 스타일: 굵은 Arial Black 대신 SF/Helvetica 계열, 얇은 굵기 + 타이트한 자간, 두 줄
  const LINES = ['The', 'Portfolio'];
  const FACE = '"SF Pro Display", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif';
  const setFont = (px) => {
    mctx.font = `500 ${px}px ${FACE}`;
    mctx.letterSpacing = `${-px * 0.035}px`; // 애플 특유의 음수 자간
  };

  let fontSize = mask.height * 0.42;
  setFont(fontSize);

  const maxWidth = mask.width * 0.8;
  const widest = Math.max(...LINES.map((l) => mctx.measureText(l).width));
  if (widest > maxWidth) fontSize *= maxWidth / widest;

  setFont(fontSize);
  mctx.textAlign = 'center';
  mctx.textBaseline = 'middle';
  mctx.fillStyle = '#000';

  const lineHeight = fontSize * 0.94;
  const top = mask.height / 2 - (lineHeight * (LINES.length - 1)) / 2;
  LINES.forEach((line, i) => mctx.fillText(line, mask.width / 2, top + lineHeight * i));

  const image = mctx.getImageData(0,0,mask.width,mask.height);
  const data = image.data;

  nameParticles = [];
  ambientParticles = [];

  // Denser grid than v3.
  const stepX = w < 700 ? 4.15 : 4.75;
  const stepY = w < 700 ? 4.9 : 5.55;

  // Local background remains only slightly larger than the title.
  const fieldLeft = w * .035;
  const fieldRight = w * .965;
  const fieldTop = h * .13;
  const fieldBottom = h * .87;

  for (let y = fieldTop; y <= fieldBottom; y += stepY) {
    for (let x = fieldLeft; x <= fieldRight; x += stepX) {
      const sx = x*scale;
      const sy = y*scale;
      let density = sampleMask(data, mask.width, mask.height, sx, sy);

      // Gentle contrast shaping preserves anti-aliased edge values.
      density = Math.pow(Math.max(0,density), .82);

      if (density > .014) {
        const rampIndex = Math.max(
          1,
          Math.min(NAME_RAMP.length-1, Math.round(density*(NAME_RAMP.length-1)))
        );

        nameParticles.push({
          x,y,
          density,
          ch:NAME_RAMP[rampIndex],
          seed:Math.random()*1000
        });

      } else if (Math.random() < .095) {
        ambientParticles.push({
          x:x + (Math.random()-.5)*1.6,
          y:y + (Math.random()-.5)*1.6,
          ch:AMBIENT_RAMP[Math.floor(Math.random()*AMBIENT_RAMP.length)],
          alpha:.018 + Math.random()*.028,
          seed:Math.random()*1000
        });
      }
    }
  }
}

function drawNameScene(time) {
  const rect = nameCanvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  nctx.clearRect(0,0,w,h);

  nctx.textAlign='center';
  nctx.textBaseline='middle';

  // Background ASCII: smaller, quieter, slower.
  nctx.font = `${w < 700 ? 4.2 : 4.8}px "SF Mono", ui-monospace, Menlo, "Courier New", monospace`;

  for (const p of ambientParticles) {
    const dx = Math.sin(time*.00032 + p.seed) * .85;
    const dy = Math.cos(time*.00028 + p.seed*.73) * .65;
    nctx.fillStyle = `rgba(122,126,182,${p.alpha})`;
    nctx.fillText(p.ch,p.x+dx,p.y+dy);
  }

  // Main name: fine-grained density, subtle breathing only.
  nctx.font = `600 ${w < 700 ? 4.35 : 5.05}px "SF Mono", ui-monospace, Menlo, "Courier New", monospace`;

  for (const p of nameParticles) {
    const microY = Math.sin(time*.00072 + p.seed) * .11;
    const alpha = Math.min(.99, .17 + Math.pow(p.density,.72)*.84);
    nctx.fillStyle = `rgba(43,42,184,${alpha})`;
    nctx.fillText(p.ch,p.x,p.y+microY);
  }

  requestAnimationFrame(drawNameScene);
}

requestAnimationFrame(() => {
  buildNameScene();
  requestAnimationFrame(drawNameScene);
});

window.addEventListener('resize', buildNameScene);

const FRAME_MS = 80;
const LOOPS = 2;
let frame = 0;
let loops = 0;
let timer = null;
let started = false;

function playIntro() {
  clearInterval(timer);
  frame = 0;
  loops = 0;
  stage.classList.remove('exit','show-name','fireworks');
  fireworksActive = false;
  sparks = [];
  fctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  ascii.textContent = FRAMES[0];

  // small hold before movement begins
  setTimeout(() => {
    timer = setInterval(() => {
      ascii.textContent = FRAMES[frame];
      frame++;

      if(frame >= FRAMES.length) {
        frame = 0;
        loops++;

        if(loops >= LOOPS) {
          clearInterval(timer);

          // hold the final motion frame for a beat
          setTimeout(() => {
            stage.classList.add('exit');

            // ASCII fireworks bridge the intro into the name.
            setTimeout(() => {
              startFireworks();
            }, 360);

            // Let the bursts bloom, then reveal the ASCII name underneath.
            setTimeout(() => {
              stage.classList.add('show-name');
            }, 1350);

            // 이름이 다 뜨고 한 박자 쉰 뒤 부모 페이지에 끝났다고 알림
            setTimeout(finish, 3950);

          }, 260);
        }
      }
    }, FRAME_MS);
  }, 220);
}

// index.html 안에 iframe으로 얹혔을 때만 부모에게 종료를 알린다 (단독으로 열면 그대로 유지)
const embedded = window.parent !== window;
function finish() {
  if (embedded) parent.postMessage('intro-done', '*');
}

// 부모에게 "이 파일 정상적으로 떴다"고 즉시 알린다 (404면 이 신호가 안 감)
if (embedded) parent.postMessage('intro-alive', '*');

// 임베드 중엔 클릭 = 건너뛰기, 단독 실행이면 처음부터 다시 재생
window.addEventListener('click', () => (embedded ? finish() : playIntro()));

playIntro();
</script>
